<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Network Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* CSS cho Section nhúng */
        #mera-map-section {
            position: relative;
            width: 100%;
            height: 800px; /* Chiều cao section, Sir có thể tùy chỉnh */
            background-color: #0a0e17; /* Nền biển tối màu */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #mera-map {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Tùy chỉnh label (tên địa danh) */
        .map-label {
            background: transparent;
            border: none;
            box-shadow: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            text-shadow: 1px 1px 3px #000, -1px -1px 3px #000, 1px -1px 3px #000, -1px 1px 3px #000;
        }
        .map-label::before { display: none; } /* Ẩn mũi tên của tooltip */

        /* Hiệu ứng data chạy trên tuyến cáp */
        .cable-line {
            stroke: #00b4d8; /* Màu xanh dương nhạt cho line kết nối */
            stroke-width: 3;
            transition: stroke-opacity 0.5s ease;
        }
        
        .cable-data-flow {
            stroke: #ffffff;
            stroke-width: 3;
            stroke-dasharray: 5, 20; /* Tạo vạch đứt (hạt data) */
            animation: flowData 2s linear infinite;
            transition: stroke-opacity 0.5s ease;
        }

        @keyframes flowData {
            0% { stroke-dashoffset: 25; }
            100% { stroke-dashoffset: 0; }
        }

        /* Khu vực Buttons */
        .map-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000; /* Đảm bảo nằm trên map */
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .btn-network {
            background: rgba(13, 27, 42, 0.85);
            border: 1px solid #00b4d8;
            color: #fff;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 250px; /* Width lớn hơn height theo yêu cầu */
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn-network:hover, .btn-network.active {
            background: #00b4d8;
            color: #000;
            box-shadow: 0 0 15px #00b4d8;
        }
    </style>
</head>
<body>

    <div id="mera-map-section">
        <div id="mera-map"></div>
        <div class="map-controls">
            <button class="btn-network" data-network="backbone">Vietnam Backbone</button>
            <button class="btn-network" data-network="inland">International Inland Network</button>
            <button class="btn-network" data-network="submarine">International Submarine Network</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. KHỞI TẠO MAP (Chặn tương tác người dùng)
            const map = L.map('mera-map', {
                zoomControl: false,
                dragging: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                boxZoom: false,
                keyboard: false,
                touchZoom: false
            });

            // 2. VẼ ĐẤT LIỀN MÀU XANH LÁ (Dùng GeoJSON)
            // Lấy dữ liệu viền các quốc gia (chỉ dùng màu, không dùng nền raster)
            fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
                .then(res => res.json())
                .then(data => {
                    L.geoJSON(data, {
                        style: function (feature) {
                            return {
                                color: "#000000", // Viền quốc gia màu đen
                                weight: 1,
                                fillColor: "#0b3b24", // Màu đất liền xanh lá đậm tương phản
                                fillOpacity: 1
                            };
                        }
                    }).addTo(map);
                });

            // 3. ĐỊNH NGHĨA TỌA ĐỘ CÁC POINT
            const points = {
                // Vietnam
                hanoi: { lat: 21.0285, lng: 105.8542, name: "Hà Nội" },
                vinh: { lat: 18.6796, lng: 105.6813, name: "Vinh" },
                danang: { lat: 16.0471, lng: 108.2068, name: "Đà Nẵng" },
                quynhon: { lat: 13.7829, lng: 109.2196, name: "Quy Nhơn" },
                hcm: { lat: 10.8231, lng: 106.6297, name: "Hồ Chí Minh" },
                vungtau: { lat: 10.3459, lng: 107.0842, name: "Vũng Tàu" },
                quangninh: { lat: 20.9504, lng: 107.0733, name: "Quảng Ninh" },
                mongcai: { lat: 21.5297, lng: 107.9555, name: "Móng Cái" },
                tanthanh: { lat: 21.9686, lng: 106.7573, name: "Tân Thanh" },
                laobao: { lat: 16.6111, lng: 106.5925, name: "Lao Bảo" },
                poy: { lat: 14.6933, lng: 107.5611, name: "Bờ Y" },
                mocbai: { lat: 11.0772, lng: 106.1755, name: "Mộc Bài" },
                // International
                namninh: { lat: 22.8149, lng: 108.3150, name: "Nam Ninh" },
                hongkong: { lat: 22.3193, lng: 114.1694, name: "Hong Kong" },
                savannakhet: { lat: 16.5518, lng: 104.7570, name: "Savanakhet" },
                bangkok: { lat: 13.7563, lng: 100.5018, name: "Bang Kok" },
                singapore: { lat: 1.3521, lng: 103.8198, name: "Singapore" },
                malaysia: { lat: 3.1390, lng: 101.6869, name: "Malaysia" }, // KL
                cambodia_south: { lat: 10.6253, lng: 103.5234, name: "" }, // Point kết nối ko tên
                thai_se: { lat: 12.6713, lng: 101.2562, name: "" } // Point kết nối ko tên
            };

            // 4. ĐỊNH NGHĨA CÁC TUYẾN CÁP (NETWORK ROUTES)
            const networks = {
                backbone: {
                    nodes: [points.hanoi, points.vinh, points.danang, points.quynhon, points.hcm],
                    lines: [
                        [points.hanoi, points.vinh],
                        [points.vinh, points.danang],
                        [points.danang, points.quynhon],
                        [points.quynhon, points.hcm]
                    ]
                },
                inland: {
                    nodes: [points.tanthanh, points.quangninh, points.mongcai, points.namninh, points.hanoi, points.laobao, points.savannakhet, points.bangkok, points.poy, points.mocbai, points.hcm, points.malaysia, points.singapore],
                    lines: [
                        [points.hanoi, points.tanthanh], [points.tanthanh, points.namninh],
                        [points.hanoi, points.quangninh], [points.quangninh, points.mongcai], [points.mongcai, points.namninh],
                        [points.laobao, points.savannakhet], [points.savannakhet, points.bangkok],
                        [points.poy, points.bangkok], [points.mocbai, points.bangkok],
                        [points.hcm, points.mocbai],
                        [points.bangkok, points.malaysia], [points.malaysia, points.singapore]
                    ]
                },
                submarine: {
                    nodes: [points.hongkong, points.danang, points.quynhon, points.vungtau, points.cambodia_south, points.thai_se, points.singapore, points.bangkok],
                    lines: [
                        [points.hongkong, points.danang],
                        [points.danang, points.quynhon],
                        [points.quynhon, points.vungtau],
                        [points.vungtau, points.singapore],
                        [points.singapore, points.cambodia_south], [points.cambodia_south, points.thai_se], [points.thai_se, points.bangkok],
                        [points.hongkong, {lat: 16.0, lng: 115.0}, points.singapore] // Tuyến ngoài khơi
                    ]
                }
            };

            const allElements = []; // Chứa tất cả các layer để xử lý độ mờ

            // Hàm vẽ tuyến cáp
            function drawNetwork(networkData, networkId) {
                // Vẽ đường kết nối
                networkData.lines.forEach(lineCoords => {
                    const coords = lineCoords.map(p => [p.lat, p.lng]);
                    
                    // Vẽ base line màu xanh dương
                    const baseLine = L.polyline(coords, {
                        className: 'cable-line'
                    }).addTo(map);

                    // Vẽ line trắng đứt đoạn tạo hiệu ứng data chạy
                    const dataLine = L.polyline(coords, {
                        className: 'cable-data-flow'
                    }).addTo(map);

                    allElements.push({ element: baseLine, networkId: networkId, type: 'line' });
                    allElements.push({ element: dataLine, networkId: networkId, type: 'line' });
                });

                // Vẽ các điểm (points)
                networkData.nodes.forEach(node => {
                    const marker = L.circleMarker([node.lat, node.lng], {
                        radius: 5,
                        fillColor: "#ff0000", // Point màu đỏ
                        color: "#fff",
                        weight: 1,
                        fillOpacity: 1
                    }).addTo(map);

                    if (node.name) {
                        marker.bindTooltip(node.name, {
                            permanent: true,
                            direction: 'right',
                            className: 'map-label',
                            offset: [5, 0]
                        });
                    }

                    allElements.push({ element: marker, networkId: networkId, type: 'node' });
                });
            }

            // Render tất cả các mạng
            Object.keys(networks).forEach(key => drawNetwork(networks[key], key));

            // 5. VIEW MẶC ĐỊNH & XỬ LÝ SỰ KIỆN NÚT BẤM
            // Default View: Bao trọn Đông Nam Á, tập trung Việt Nam và Malaysia
            const defaultBounds = L.latLngBounds([
                [23.5, 99.0], // Top Left (Myanmar/China border)
                [1.0, 115.0]  // Bottom Right (Singapore/Borneo)
            ]);
            map.fitBounds(defaultBounds, { padding: [50, 50] });

            const buttons = document.querySelectorAll('.btn-network');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Xóa trạng thái active của các nút khác
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const selectedNet = this.getAttribute('data-network');
                    let bounds = L.latLngBounds([]);

                    // Xử lý làm mờ và tính toán vùng cần zoom
                    allElements.forEach(item => {
                        if (item.networkId === selectedNet) {
                            // Giữ nguyên hiển thị
                            if (item.type === 'line') item.element.setStyle({ opacity: 1, fillOpacity: 1 });
                            if (item.type === 'node') {
                                item.element.setStyle({ opacity: 1, fillOpacity: 1 });
                                item.element.getTooltip()?.setOpacity(1);
                                bounds.extend(item.element.getLatLng()); // Thêm tọa độ vào box để zoom
                            }
                        } else {
                            // Làm mờ đi 40% (opacity 0.4)
                            if (item.type === 'line') item.element.setStyle({ opacity: 0.4, fillOpacity: 0.4 });
                            if (item.type === 'node') {
                                item.element.setStyle({ opacity: 0.4, fillOpacity: 0.4 });
                                item.element.getTooltip()?.setOpacity(0.4);
                            }
                        }
                    });

                    // Zoom sát vào tuyến cáp được chọn (Chừa khoảng không phía dưới để không bị button đè lên)
                    if (bounds.isValid()) {
                        map.flyToBounds(bounds, {
                            paddingBottomRight: [0, 100], // Bù trừ không gian cho button ở dưới
                            paddingTopLeft: [50, 50],
                            duration: 1.5 // Thời gian animation zoom (giây)
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
