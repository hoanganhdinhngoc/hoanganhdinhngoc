<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Network Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0px; padding: 0px; }

        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('../font/SVN-Gilroy%20Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('../font/SVN-Gilroy%20SemiBold.otf') format('opentype');
            font-weight: 600;
            font-style: normal;
        }

        .leaflet-control-attribution { display: none !important; }

        #mera-map-section {
            position: relative;
            width: 100%;
            height: 100vh; 
            background-color: #090830;
            font-family: 'SVN-Gilroy', Arial, sans-serif;
            overflow: hidden;
        }

        #mera-map { width: 100%; height: 100%; background: transparent; }

        /* BẢNG THÔNG TIN MẠNG LƯỚI BÊN TRÁI */
        .network-info-panel {
            position: absolute;
            top: 8%; 
            left: 5%; 
            z-index: 1000;
            pointer-events: none; 
            color: #ffffff;
            max-width: 230px;
            text-align: left;
            text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .network-info-panel.hidden { opacity: 0; transform: translateY(-10px); }

        .network-info-panel h3 {
            font-size: 21px;
            font-weight: 600; 
            margin-bottom: 12px;
            line-height: 1.2;
            color: #ffffff;
        }

        .network-info-panel .desc-content {
            font-size: 13px;
            font-weight: 400; 
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
        }

        .network-info-panel ul { padding-left: 20px; margin-top: 10px; }
        .network-info-panel li { margin-bottom: 6px; }

        /* UI STYLE CHO CÁC PHẦN TỬ CỦA MAP */
        .cable-line, .cable-data-flow, .unified-marker { transition: filter 0.4s ease, opacity 0.4s ease !important; }
        
        .cable-line { 
            stroke: #6bd5ff; stroke-width: 3; vector-effect: non-scaling-stroke; 
            will-change: opacity, filter; transform: translateZ(0); 
        }
        
        .cable-data-flow {
            stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 4, 26; 
            animation: flowData 2s linear infinite; 
            filter: drop-shadow(0px 0px 6px #22c0ff);
            vector-effect: non-scaling-stroke; 
            will-change: stroke-dashoffset, opacity, filter; transform: translateZ(0); 
        }

        @keyframes flowData { 0% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 0; } }

        .inactive-element { filter: grayscale(100%) !important; opacity: 0.25 !important; }
        .unified-marker { position: absolute; pointer-events: none; transition: filter 0.4s ease, opacity 0.4s ease !important; will-change: opacity, transform;}

        .custom-red-dot {
            position: absolute; width: clamp(5px, 0.7vw, 8px); height: clamp(5px, 0.7vw, 8px); 
            background-color: #9b0101; border: 1px solid #fff; border-radius: 50%; 
            transform: translate(-50%, -50%); box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        .map-label-overlay {
            position: absolute; color: #ffffff; font-weight: bold; font-size: clamp(8px, 1.1vw, 13px); 
            text-shadow: 2px 2px 3px #000, -2px -2px 3px #000, 2px -2px 3px #000, -2px 2px 3px #000; white-space: nowrap;
        }

        .cable-label-overlay {
            position: absolute; color: #ffffff; font-weight: 500; font-size: clamp(6px, 0.8vw, 9px); 
            text-shadow: 1.5px 1.5px 2px #000, -1.5px -1.5px 2px #000, 1.5px -1.5px 2px #000, -1.5px 1.5px 2px #000; white-space: nowrap;
            opacity: 0; transition: opacity 0.4s ease;
        }

        /* UI CONTROLS */
        .map-controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; pointer-events: auto; width: 95%; 
        }

        .btn-network {
            background: rgba(7, 11, 20, 0.85); border: 1px solid #ffffff; color: #ffffff;
            padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 30px; cursor: pointer;
            text-align: center; transition: all 0.3s ease; white-space: nowrap; font-family: 'SVN-Gilroy', Arial, sans-serif; backdrop-filter: blur(5px);
        }
        .btn-network:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-network.active { background: #22c55e; color: #ffffff; border-color: #22c55e; box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3); }

        /* ========================================================= */
        /* GIAO DIỆN ĐIỆN THOẠI & TABLET CHUYÊN BIỆT                 */
        /* ========================================================= */
        @media (max-width: 768px) {
            .network-info-panel {
                top: 15px;
                left: 15px;
                max-width: 80%;
            }
            .network-info-panel h3 { font-size: 15px; margin-bottom: 6px; }
            .network-info-panel .desc-content { font-size: 10px; line-height: 1.4; }
            .network-info-panel ul { padding-left: 15px; margin-top: 5px; }
            .network-info-panel li { margin-bottom: 3px; }

            .map-controls {
                bottom: 15px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                width: 90%;
            }
            .btn-network {
                padding: 8px 5px; 
                font-size: 10px;  
                white-space: normal; 
                line-height: 1.2;
            }
        }
    </style>
</head>
<body>

    <div id="mera-map-section">
        <div id="mera-map"></div>
        
        <div id="network-info-panel" class="network-info-panel">
            <h3 id="info-title"></h3>
            <div id="info-desc" class="desc-content"></div>
        </div>

        <div class="map-controls" id="control-panel">
            <button class="btn-network active" data-network="default">Mera network</button>
            <button class="btn-network" data-network="backbone">Vietnam Backbone</button>
            <button class="btn-network" data-network="inland">International Inland Network</button>
            <button class="btn-network" data-network="submarine">International Submarine Network</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const networkContents = {
                default: {
                    title: "Mera Global Network",
                    desc: `<p>Hệ thống mạng lưới viễn thông toàn cầu của Mera, mang đến kết nối tốc độ cao và ổn định.</p><ul><li>Bao phủ đa quốc gia</li><li>Độ trễ cực thấp</li><li>Bảo mật cấp độ doanh nghiệp</li></ul>`
                },
                backbone: {
                    title: "Vietnam Backbone",
                    desc: `<p>Tuyến cáp trục quốc gia nối liền các trung tâm kinh tế trọng điểm của Việt Nam.</p><ul><li>Dung lượng truyền tải lớn</li><li>Dự phòng 1+1 linh hoạt</li></ul>`
                },
                inland: {
                    title: "International Inland Network",
                    desc: `<p>Mạng cáp quang đất liền kết nối trực tiếp các quốc gia trong khu vực Đông Nam Á và Châu Á.</p><p>Đảm bảo hướng tuyến đất liền an toàn khi có sự cố cáp biển.</p>`
                },
                submarine: {
                    title: "International Submarine Network",
                    desc: `<p>Hệ thống cáp quang biển kết nối quốc tế dung lượng siêu cao.</p><ul><li>Hướng đi Hong Kong, Singapore</li><li>Đa dạng rẽ nhánh</li></ul>`
                }
            };

            // ========================================================
            // CẤU HÌNH TỌA ĐỘ VÀ ZOOM CHO 3 MÔI TRƯỜNG
            // Đã cập nhật Desktop khớp với thông số bản cũ của Sir
            // ========================================================
            const viewConfigs = {
                desktop: { 
                    default:   { center: [10.7, 107.0], zoom: 4.7 },
                    backbone:  { center: [15.8, 106.5], zoom: 5.4 },
                    inland:    { center: [10.9, 103.5], zoom: 4.7 },
                    submarine: { center: [10.6, 109.0], zoom: 4.8 }
                },
                tablet: { 
                    default:   { center: [10.2, 107.0], zoom: 4.2 },
                    backbone:  { center: [15.2, 106.5], zoom: 5.0 },
                    inland:    { center: [10.5, 103.5], zoom: 4.2 },
                    submarine: { center: [10.3, 104.0], zoom: 4.2 }
                },
                mobile: { 
                    default:   { center: [13.0, 107.0], zoom: 4.2 }, 
                    backbone:  { center: [15.7, 106.5], zoom: 4.9 },
                    inland:    { center: [13.0, 106.2], zoom: 4.2 },
                    submarine: { center: [12.0, 107.0], zoom: 4.2 }
                }
            };

            function getDeviceType() {
                const width = window.innerWidth;
                if (width <= 768) return 'mobile';
                if (width <= 1024) return 'tablet';
                return 'desktop';
            }

            let currentDevice = getDeviceType();
            let currentActiveNet = 'default';

            const map = L.map('mera-map', {
                zoomSnap: 0, bounceAtZoomLimits: false, renderer: L.svg({ padding: 10 }), 
                zoomControl: false, dragging: false, scrollWheelZoom: false, 
                doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false,
                attributionControl: false
            });

            let initConfig = viewConfigs[currentDevice].default;
            map.setView(initConfig.center, initConfig.zoom, { animate: false });

            map.createPane('baseMapPane');
            map.getPane('baseMapPane').style.zIndex = 100;
            
            // ========================================================
            // BỘ DATA POINTS VÀ LINKS CẬP NHẬT TỪ BẢN CŨ CỦA SIR
            // ========================================================
            const points = {
                hanoi: { lat: 21.0285, lng: 105.8542, name: "Hà Nội", labelAngle: 230, labelDistance: 5, nets: ['backbone', 'inland'] },
                vinh: { lat: 18.8796, lng: 105.6813, name: "Vinh", labelAngle: 90, labelDistance: 10, nets: ['backbone', 'inland'] },
                danang: { lat: 16.0471, lng: 108.2068, name: "Đà Nẵng", labelAngle: 60, labelDistance: 11, nets: ['backbone', 'inland', 'submarine'] },
                quynhon: { lat: 13.7829, lng: 109.2196, name: "Quy Nhơn", labelAngle: 90, labelDistance: 15, nets: ['backbone', 'inland', 'submarine'] },
                hcm: { lat: 10.8231, lng: 106.6297, name: "Hồ Chí Minh", labelAngle: 90, labelDistance: 10, nets: ['backbone', 'inland'] },
                vungtau: { lat: 10.3459, lng: 107.0842, name: "Vũng Tàu", labelAngle: 180, labelDistance: 10, nets: ['backbone', 'inland', 'submarine'] },
                quangninh: { lat: 20.9504, lng: 107.0733, name: "Quảng Ninh", labelAngle: 120, labelDistance: 5, nets: ['backbone', 'inland'] },
                mongcai: { lat: 21.5297, lng: 107.9555, name: "Móng Cái", labelAngle: 90, labelDistance: 10, nets: ['backbone', 'inland'] },
                tanthanh: { lat: 21.9686, lng: 106.7573, name: "Tân Thanh", labelAngle: 310, labelDistance: 5, nets: ['backbone', 'inland'] },
                laobao: { lat: 16.6111, lng: 106.5925, name: "Lao Bảo", labelAngle: 180, labelDistance: 10, nets: ['inland'] },
                poy: { lat: 14.6933, lng: 107.5611, name: "Po Y", labelAngle: 90, labelDistance: 10, nets: ['inland'] },
                mocbai: { lat: 11.0772, lng: 106.1755, name: "Mộc Bài", labelAngle: 0, labelDistance: 10, nets: ['backbone', 'inland'] },
                namninh: { lat: 22.8149, lng: 108.3150, name: "Nam Ninh", labelAngle: 10, labelDistance: 10, nets: ['inland'] },
                hongkong: { lat: 22.3193, lng: 114.1694, name: "Hong Kong", labelAngle: 90, labelDistance: 15, nets: ['inland', 'submarine'] },
                savannakhet: { lat: 16.5518, lng: 104.7570, name: "Savanakhet", labelAngle: 300, labelDistance: 10, nets: ['inland'] },
                bangkok: { lat: 13.7563, lng: 100.5018, name: "Bang Kok", labelAngle: 270, labelDistance: 12, nets: ['inland', 'submarine'] },
                singapore: { lat: 1.3521, lng: 103.8198, name: "Singapore", labelAngle: 180, labelDistance: 10, nets: ['inland', 'submarine'] },
                malaysia: { lat: 3.1390, lng: 101.6869, name: "Malaysia", labelAngle: 270, labelDistance: 10, nets: ['inland'] },
                cambodia_south: { lat: 10.6253, lng: 103.5234, name: "Sihanoukville", labelAngle: 0, labelDistance: 10, nets: ['submarine'] }, 
                thai_se: { lat: 12.6713, lng: 101.2562, name: "Rayong", labelAngle: 100, labelDistance: 12, nets: ['inland', 'submarine'] },
                thai_dummy: { lat: 8.8, lng: 99, name: "", isHidden: true, nets: ['inland'] },
                malaydummy: { lat: 5.82, lng: 102.55, name: "", isHidden: true, nets: ['inland'] },
                dummy_vinh: { lat: 18.9796, lng: 105.1813, name: "", isHidden: true, nets: ['submarine'] },
                dummy_danang: { lat: 16.4471, lng: 107.2068, name: "", isHidden: true, nets: ['submarine'] },
                dummy_quynhon: { lat: 13.4829, lng: 108.1196, name: "", isHidden: true, nets: ['submarine'] },
                dummy_dn: { lat: 18.0, lng: 115.1, name: "", isHidden: true, nets: ['submarine'] },
                dummy_dn2: { lat: 15.2, lng: 114.9, name: "", isHidden: true, nets: ['submarine'] },
                dummy_qn: { lat: 13.2, lng: 114.7, name: "", isHidden: true, nets: ['submarine'] },
                dummy_vt: { lat: 9.3, lng: 112.0, name: "", isHidden: true, nets: ['submarine'] }
            };

            const links = [
                { p1: 'hanoi', p2: 'vinh', bend: -0.1, nets: ['backbone', 'inland'] },
                { p1: 'hanoi', p2: 'dummy_vinh', bend: 0.01, nets: ['backbone', 'inland'] },
                { p1: 'dummy_vinh', p2: 'dummy_danang', bend: 0.04, nets: ['backbone', 'inland'] },
                { p1: 'danang', p2: 'dummy_danang', bend: 0.04, nets: ['backbone', 'inland'] },
                { p1: 'dummy_danang', p2: 'dummy_quynhon', bend: -0.2, nets: ['backbone', 'inland'] },
                { p1: 'quynhon', p2: 'dummy_quynhon', bend: -0.2, nets: ['backbone', 'inland'] },
                { p1: 'dummy_quynhon', p2: 'hcm', bend: -0.2, nets: ['backbone', 'inland'] },
                { p1: 'vinh', p2: 'danang', bend: 0.1, nets: ['backbone', 'inland'] },
                { p1: 'vinh', p2: 'dummy_vinh', bend: 0.01, nets: ['backbone', 'inland'] },
                { p1: 'danang', p2: 'quynhon', bend: -0.15, nets: ['backbone', 'inland'] },
                { p1: 'quynhon', p2: 'hcm', bend: -0.15, nets: ['backbone', 'inland'] },
                { p1: 'hanoi', p2: 'tanthanh', bend: -0.1, nets: ['backbone', 'inland'] },
                { p1: 'quangninh', p2: 'mongcai', bend: 0.05, nets: ['backbone', 'inland'] },
                { p1: 'hanoi', p2: 'quangninh', bend: 0.1, nets: ['backbone', 'inland'] },
                { p1: 'hcm', p2: 'mocbai', bend: -0.1, nets: ['backbone', 'inland'] },
                { p1: 'hcm', p2: 'vungtau', bend: 0.1, nets: ['backbone', 'inland'] },
                { p1: 'tanthanh', p2: 'namninh', bend: -0.1, nets: ['inland'] },
                { p1: 'mongcai', p2: 'namninh', bend: 0.1, nets: ['inland'] },
                { p1: 'laobao', p2: 'savannakhet', bend: 0.1, nets: ['inland'] },
                { p1: 'savannakhet', p2: 'bangkok', bend: 0.2, nets: ['inland'] },
                { p1: 'savannakhet', p2: 'bangkok', bend: -0.3, nets: ['inland'] },
                { p1: 'poy', p2: 'bangkok', bend: -0.1, nets: ['inland'] },
                { p1: 'poy', p2: 'thai_se', bend: -0.1, nets: ['inland'] },
                { p1: 'mocbai', p2: 'bangkok', bend: -0.1, nets: ['inland'] },
                { p1: 'bangkok', p2: 'thai_dummy', bend: 0.2, nets: ['inland'] },
                { p1: 'thai_dummy', p2: 'malaysia', bend: -0.1, nets: ['inland'] },
                { p1: 'malaysia', p2: 'singapore', bend: -0.1, nets: ['inland'] },
                { p1: 'namninh', p2: 'hongkong', bend: 0.1, nets: ['inland'] },
                { p1: 'bangkok', p2: 'thai_se', bend: -0.1, nets: ['inland'] },
                { p1: 'laobao', p2: 'danang', bend: -0.1, nets: ['inland'] },
                { p1: 'poy', p2: 'quynhon', bend: -0.1, nets: ['inland'] },
                
                { p1: 'danang', p2: 'dummy_dn', bend: 0.15, nets: ['submarine'], name: 'ALC' },
                { p1: 'danang', p2: 'dummy_dn2', bend: 0.15, nets: ['submarine'], name: 'APG' },
                { p1: 'quynhon', p2: 'dummy_qn', bend: 0.15, nets: ['submarine'] },
                { p1: 'vungtau', p2: 'dummy_vt', bend: 0.15, nets: ['submarine'] },
                { p1: 'hongkong', p2: 'dummy_dn', bend: -0.05, nets: ['submarine'] },
                { p1: 'dummy_dn', p2: 'dummy_qn', bend: -0.03, nets: ['submarine'] },
                { p1: 'dummy_qn', p2: 'dummy_vt', bend: -0.03, nets: ['submarine'], name: 'APG' },
                { p1: 'dummy_vt', p2: 'singapore', bend: -0.2, nets: ['submarine'] },
                { p1: 'thai_se', p2: 'malaydummy', bend: 0.05, nets: ['submarine'] },
                { p1: 'cambodia_south', p2: 'malaydummy', bend: 0.1, nets: ['submarine'] },
                { p1: 'malaydummy', p2: 'singapore', bend: -0.8, nets: ['submarine'] }
            ];

            const allElements = []; 

            function getCurvedPath(p1, p2, bend = 0.1) {
                if (bend === 0) return [[p1.lat, p1.lng], [p2.lat, p2.lng]]; 
                let midLat = (p1.lat + p2.lat) / 2;
                let midLng = (p1.lng + p2.lng) / 2;
                let dx = p2.lng - p1.lng;
                let dy = p2.lat - p1.lat;
                let ctrlLat = midLat - dx * bend;
                let ctrlLng = midLng + dy * bend;
                
                let pointsPath = [];
                for (let i = 0; i <= 40; i++) {
                    let t = i / 40;
                    let lat = Math.pow(1-t, 2)*p1.lat + 2*(1-t)*t*ctrlLat + Math.pow(t, 2)*p2.lat;
                    let lng = Math.pow(1-t, 2)*p1.lng + 2*(1-t)*t*ctrlLng + Math.pow(t, 2)*p2.lng;
                    pointsPath.push([lat, lng]);
                }
                return pointsPath;
            }

            links.forEach(link => {
                const node1 = points[link.p1];
                const node2 = points[link.p2];
                if (!node1 || !node2) return;

                const coords = getCurvedPath(node1, node2, link.bend);
                const baseLine = L.polyline(coords, { className: 'cable-line' }).addTo(map);
                const dataLine = L.polyline(coords, { className: 'cable-data-flow' }).addTo(map);

                allElements.push({ element: baseLine, nets: link.nets, type: 'line', isData: false });
                allElements.push({ element: dataLine, nets: link.nets, type: 'line', isData: true });

                if (link.name) {
                    let midIndex = 20; 
                    let midPoint = coords[midIndex];
                    let dy = coords[midIndex + 1][0] - coords[midIndex - 1][0];
                    let dx = coords[midIndex + 1][1] - coords[midIndex - 1][1];
                    let angle = Math.atan2(-dy, dx) * (180 / Math.PI); 
                    
                    if (dx < 0) angle += 180;

                    let htmlContent = `<div class="cable-label-overlay" style="transform: translate(-50%, -50%) rotate(${angle}deg) translateY(-8px);">${link.name}</div>`;
                    
                    const labelIcon = L.divIcon({ className: 'unified-marker', html: htmlContent, iconSize: [0, 0], iconAnchor: [0, 0] });
                    const labelMarker = L.marker(midPoint, { icon: labelIcon }).addTo(map);
                    
                    allElements.push({ element: labelMarker, nets: link.nets, type: 'label', isLabel: true });
                }
            });

            Object.keys(points).forEach(key => {
                const node = points[key];
                if (!node.isHidden) {
                    let htmlContent = `<div class="custom-red-dot"></div>`;

                    if (node.name) {
                        let angle = node.labelAngle !== undefined ? node.labelAngle : 90;
                        let distance = node.labelDistance !== undefined ? node.labelDistance : 5;
                        let rad = angle * (Math.PI / 180);
                        let widthComp = node.name.length * 3.5; 
                        let heightComp = 8; 
                        let dynamicDistance = distance + (widthComp * Math.abs(Math.sin(rad))) + (heightComp * Math.abs(Math.cos(rad)));

                        let offsetX = dynamicDistance * Math.sin(rad);
                        let offsetY = -dynamicDistance * Math.cos(rad);

                        htmlContent += `<div class="map-label-overlay" style="transform: translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px));">${node.name}</div>`;
                    }

                    const customIcon = L.divIcon({ className: 'unified-marker', html: htmlContent, iconSize: [0, 0], iconAnchor: [0, 0] });
                    const marker = L.marker([node.lat, node.lng], { icon: customIcon }).addTo(map);
                    allElements.push({ element: marker, nets: node.nets, type: 'node' });
                }
            });

            const buttons = document.querySelectorAll('.btn-network');
            const infoPanel = document.getElementById('network-info-panel');
            const infoTitle = document.getElementById('info-title');
            const infoDesc = document.getElementById('info-desc');

            function updateMapView(network) {
                const view = viewConfigs[currentDevice][network];
                let targetCenter = L.latLng(view.center[0], view.center[1]);
                let targetZoom = view.zoom; 

                if (map.options.maxBounds) {
                    targetCenter = map._limitCenter(targetCenter, targetZoom, map.options.maxBounds);
                }
                map.flyTo(targetCenter, targetZoom, { duration: 1.2 });
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const selectedNet = this.getAttribute('data-network');
                    currentActiveNet = selectedNet;

                    infoPanel.classList.add('hidden');
                    setTimeout(() => {
                        if(networkContents[selectedNet]) {
                            infoTitle.innerHTML = networkContents[selectedNet].title;
                            infoDesc.innerHTML = networkContents[selectedNet].desc;
                        }
                        infoPanel.classList.remove('hidden');
                    }, 400); 

                    allElements.forEach(item => {
                        const DOMElement = item.element.getElement();
                        
                        let isActive = false;
                        if (item.isLabel) {
                            isActive = (selectedNet === 'submarine'); 
                        } else {
                            isActive = (selectedNet === 'default' || (item.nets && item.nets.includes(selectedNet)));
                        }

                        if (DOMElement) {
                            if (isActive) {
                                DOMElement.classList.remove('inactive-element');
                                
                                // [ĐÃ SỬA] Tìm đúng dòng chữ bên trong để hiện lên
                                if (item.isLabel) {
                                    let textNode = DOMElement.querySelector('.cable-label-overlay');
                                    if (textNode) textNode.style.opacity = '1';
                                }
                                
                                if (item.isData) DOMElement.style.display = ''; 
                            } else {
                                
                                // [ĐÃ SỬA] Tìm đúng dòng chữ bên trong để ẩn đi
                                if (item.isLabel) {
                                    let textNode = DOMElement.querySelector('.cable-label-overlay');
                                    if (textNode) textNode.style.opacity = '0';
                                } else {
                                    DOMElement.classList.add('inactive-element');
                                }
                                
                                if (item.isData) DOMElement.style.display = 'none'; 
                            }
                        }
                    });

                    updateMapView(selectedNet);
                });
            });

            window.addEventListener('resize', function() {
                const newDevice = getDeviceType();
                if (newDevice !== currentDevice) {
                    currentDevice = newDevice;
                    map.options.minZoom = viewConfigs[currentDevice].default.zoom - 1.5;
                    updateMapView(currentActiveNet);
                }
            });

            const imageUrl = '../images/mera-base-map-highres.png'; 
            const img = new Image();
            img.onload = function() {
                const topLeftCoord = [35.0, 67.9]; 
                const mapWidthDegrees = 84.3; 
                const nw = L.latLng(topLeftCoord[0], topLeftCoord[1]);
                const ne = L.latLng(nw.lat, nw.lng + mapWidthDegrees);
                
                const nwPoint = map.project(nw, 10); 
                const nePoint = map.project(ne, 10);
                const scale = (nePoint.x - nwPoint.x) / img.width;
                const sePoint = L.point(nePoint.x, nwPoint.y + (img.height * scale));
                const se = map.unproject(sePoint, 10);
                
                const imgBounds = L.latLngBounds(nw, se);
                L.imageOverlay(imageUrl, imgBounds, { pane: 'baseMapPane' }).addTo(map);

                map.setMaxBounds(imgBounds);
                map.options.maxBoundsViscosity = 1.0;
                map.options.minZoom = viewConfigs[currentDevice].default.zoom - 1.5; 

                if(buttons.length > 0) buttons[0].click();
            };
            img.src = imageUrl;
            
        });
    </script>
</body>
</html>
