<div class="connect-wrapper" id="connect-section">
    <section class="section-container" style="padding-top: 0; padding-bottom: 0;">
        <div class="connect-grid">
            <div class="connect-left">
                <h2 class="section-title">Contact us</h2>
                <h3 style="font-size: 1.5rem; margin-bottom: 10px; font-weight: 400;">Send Us A Message</h3>
                <p style="color: var(--text-muted); margin: 0;">Tell us what you need and we'll respond fast.</p>
                <div class="contact-info-list">
                    <div class="contact-item"><span class="contact-icon">📞</span><div>(84) 123 456 7890</div></div>
                    <div class="contact-item"><span class="contact-icon">✉️</span><div>mera.vietnam@gmail.com</div></div>
                    <div class="contact-item"><span class="contact-icon">📍</span><div>3rd Floor, Grand Plaza, 117 Tran Duy Hung st., Ha Noi</div></div>
                </div>
            </div>
            <div>
                <form id="meraContactForm" class="custom-form">
                    <div class="form-group"><label class="form-label">First name <span class="asterisk">*</span></label><input type="text" id="fName" class="form-input" required placeholder="John Doe"></div>
                    <div class="form-group"><label class="form-label">Email <span class="asterisk">*</span></label><input type="email" id="fEmail" class="form-input" required placeholder="john@company.com"></div>
                    <div class="form-group"><label class="form-label">Phone Number <span class="asterisk">*</span></label><input type="tel" id="fPhone" class="form-input" required placeholder="+84 901 234 567"></div>
                    <div class="form-group"><label class="form-label">Company Name</label><input type="text" id="fCompany" class="form-input" placeholder="Optional"></div>
                    <div class="form-group full-width"><label class="form-label">Message</label><textarea id="fMessage" class="form-input" placeholder="How can we help you?"></textarea></div>
                    <div class="submit-area"><span id="formFeedback" class="success-msg">Thanks for submit your information</span><button type="submit" class="btn btn-green" style="border:none;">Send</button></div>
                </form>
            </div>
        </div>
    </section>
</div>
